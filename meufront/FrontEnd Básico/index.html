<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brito's.Car</title>
    <link rel="icon" type="image/x-icon" href="assets/icon_brito.png">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header id="cabecalho">
        <nav id="nav">
            <img src="./assets/Britos.car.png" alt="" />
            <ul id="nav_links">
                <a href="#">
                    <li>Sobre</li>
                </a>
                <a href="#">
                    <li>Produtos</li>
                </a>
                <a href="#">
                    <li>Contato</li>
                </a>


            </ul>
        </nav>
    </header>
    <main id="principal">
        <div id="topo">
            <h2>Produtos</h2>
            <button onclick="adicionarCard()" id="add_btn">Adicionar Produto</button>
        </div>
        <div id="container">
            <div id="card-exemplo" class="card">
                <img src="./assets/produto.jpg" alt="Imagem do produto">
                <div id="card_info">
                    <h3>Celtinha, Brabo</h3>
                    <span>FIAT</span>
                </div>
            </div>

        </div>
    </main>

    <script src="./script.js"></script>
</body>

</html>
